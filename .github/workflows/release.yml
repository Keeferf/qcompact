name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained win-x64 binary
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/QCompact/QCompact.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version=$version `
            -o publish

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/qcompact.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  qcompact.exe" | Out-File -FilePath publish/qcompact.exe.sha256 -Encoding ascii -NoNewline

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            publish/qcompact.exe `
            publish/qcompact.exe.sha256 `
            --generate-notes
